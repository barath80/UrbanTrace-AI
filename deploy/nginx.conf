# Load balancer in front of the API replicas.
#
# Docker's resolver is queried per request (valid=5s), so `docker compose up
# --scale api=N` takes effect without reloading nginx. Replicas are stateless:
# all state is in Postgres, so any request can go to any replica.

worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';
    access_log /dev/stdout main;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        client_max_body_size 20m;

        set $api http://api:8000;

        location = /lb-health { access_log off; return 200 "ok\n"; }

        # Long-lived responses: no buffering, long read timeout.
        location ~ ^/(api/live/stream|api/multi-camera/stream|ws/) {
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            # A replica that is down or restarting is skipped, not surfaced.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
